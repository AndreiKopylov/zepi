[package]
name = "zepi_browser"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone for now; wired into zepi.exe as an in-process MCP server in a later step.
[workspace]

[dependencies]
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
schemars = "1"
rmcp = { version = "0.8", features = ["server", "transport-io", "macros"] }