[workspace]
resolver = "3"
members = ["crates/core", "crates/formula", "crates/functions", "crates/model", "crates/numfmt", "crates/xlsx"]

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/gridcraft"

[workspace.dependencies]
gridcraft-core = { path = "crates/core" }
gridcraft-formula = { path = "crates/formula" }
gridcraft-functions = { path = "crates/functions" }
gridcraft-model = { path = "crates/model" }
gridcraft-numfmt = { path = "crates/numfmt" }
gridcraft-xlsx = { path = "crates/xlsx" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
aes = { version = "0.9", default-features = false }
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

