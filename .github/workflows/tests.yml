name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          npm ci
          npm --prefix packages/acp ci
          npm --prefix packages/runtime ci
      - name: Types
        run: npm run check
      - name: ACP suite (bun, the production runtime)
        run: npm run test:acp
      - name: Runtime suite
        run: npm run test:runtime
      - name: native.py prepare units
        run: python scripts/test/test_native_prepare.py
