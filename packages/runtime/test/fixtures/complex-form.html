<!doctype html><html><head><title>Complex form</title></head><body>
<div role="tablist">
  <button role="tab" aria-selected="true" onclick="sel(1)">Main</button>
  <button role="tab" aria-selected="false" onclick="sel(2)">Choices</button>
  <button role="tab" aria-selected="false" onclick="sel(3)">Extra</button>
</div>
<div role="tabpanel" id="p1">
  <input aria-label="Name"><input aria-label="Email" type="email"><input aria-label="Secret" type="password">
  <input aria-label="Age" type="number"><textarea aria-label="Notes"></textarea>
  <input aria-label="Date" type="date"><input aria-label="Time" type="time">
</div>
<div role="tabpanel" id="p2" hidden>
  <select aria-label="Region"><option value="a">A</option><option value="b">B</option><option value="c">C</option></select>
  <input aria-label="Agree" type="checkbox"><input aria-label="R1" type="radio" name="r"><input aria-label="R2" type="radio" name="r">
  <input role="combobox" aria-label="City" id="city" aria-expanded="false" aria-controls="citylist" readonly>
  <ul id="citylist" role="listbox" hidden><li role="option" onclick="pick(this,'city','citylist')">Moscow</li><li role="option" onclick="pick(this,'city','citylist')">SPB</li></ul>
  <input role="combobox" aria-label="Oblast" id="ob" aria-expanded="false" aria-controls="oblist" readonly>
  <ul id="oblist" role="listbox" hidden style="max-height:150px;overflow-y:auto;width:300px"></ul>
  <input role="switch" aria-label="Notify" type="checkbox"><input role="searchbox" aria-label="Search" type="search">
  <button onclick="document.getElementById('modal').hidden=false">Open modal</button>
</div>
<div role="tabpanel" id="p3" hidden><div contenteditable="true" aria-label="Rich"></div><button id="go" onclick="this.textContent='Done'">Submit</button></div>
<div role="dialog" aria-modal="true" aria-label="Settings" id="modal" hidden>
  <input aria-label="ModalName"><select aria-label="ModalSel"><option value="x">X</option><option value="y">Y</option></select>
  <button onclick="document.getElementById('modal').hidden=true">Confirm</button>
</div>
<script>
function sel(n){for(let i=1;i<=3;i++){document.querySelectorAll('[role=tab]')[i-1].setAttribute('aria-selected',i===n?'true':'false');document.getElementById('p'+i).hidden=i!==n;}}
function pick(li,f,l){document.getElementById(f).value=li.textContent;document.getElementById(l).hidden=true;}
const ob=document.getElementById('ob'),obl=document.getElementById('oblist');
for(let i=1;i<=40;i++){const li=document.createElement('li');li.setAttribute('role','option');li.textContent='Oblast-'+i;li.onclick=()=>pick(li,'ob','oblist');obl.appendChild(li);}
ob.addEventListener('click',()=>{obl.hidden=false;});
document.getElementById('city').addEventListener('click',()=>{document.getElementById('citylist').hidden=false;});
</script></body></html>
